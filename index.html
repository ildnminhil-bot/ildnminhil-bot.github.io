<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAMCORE AI - AI Core</title>
    <style>
        /* CSS styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #01010c; /* Không gian tối */
            font-family: 'Courier New', Courier, monospace; /* Text typewriter */
            color: #d1f7ff; /* Xanh nhạt cho glow */
        }

        #dreamcore-site {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Nền hạt nằm dưới */
        }

        #ai-core-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; /* Điều chỉnh kích thước lõi Three.js */
            height: 300px;
            z-index: 2; /* Lõi AI nằm trên hạt */
        }

        #content {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
            pointer-events: none; /* Text không chắn chuột */
        }

        #content h1 {
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin: 0;
            text-shadow: 0 0 10px #60e0ff, 0 0 20px #60e0ff;
        }

        #typewriter-text {
            font-size: 1.5em;
            margin-top: 10px;
            text-shadow: 0 0 5px #60e0ff;
        }

        /* Cursor Glow */
        .cursor-glow {
            position: fixed;
            pointer-events: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 220, 255, 0.4) 0%, rgba(100, 220, 255, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.1s, height 0.1s;
        }
    </style>
</head>
<body>
    <div id="dreamcore-site">
        <canvas id="particle-canvas"></canvas>
        <div id="ai-core-container"></div>
        <div id="content">
            <h1>DREAMCORE</h1>
            <p id="typewriter-text"></p>
        </div>
    </div>

    <!-- Tải các thư viện -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        // --- JavaScript code ---

        // 1. Particle Background (Canvas 2D)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 }; // Bán kính đẩy hạt

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', function () {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        window.addEventListener('mousemove', function (event) {
            mouse.x = event.x;
            mouse.y = event.y;
            updateCursorGlow(event.x, event.y);
        });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
                this.density = (Math.random() * 30) + 1; // Độ "nặng"
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                // Trôi chậm tự nhiên
                this.x += this.directionX;
                this.y += this.directionY;

                // Giới hạn trong màn hình
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

                // Tương tác chuột: Đẩy hạt ra xa
                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
                this.draw();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 8000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 0.5;
                let x = Math.random() * (canvas.width - size * 2 - size * 2) + size * 2;
                let y = Math.random() * (canvas.height - size * 2 - size * 2) + size * 2;
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let color = 'rgba(100, 220, 255, ' + (Math.random() * 0.3 + 0.1) + ')';
                particles.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            requestAnimationFrame(animateParticles);
        }

        // 2. Three.js AI Core (3D Object)
        const coreContainer = document.getElementById('ai-core-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, coreContainer.clientWidth / coreContainer.clientHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: true cho nền trong suốt
        renderer.setSize(coreContainer.clientWidth, coreContainer.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        coreContainer.appendChild(renderer.domElement);

        // a. Quả cầu (Central Sphere)
        const coreGeometry = new THREE.IcosahedronGeometry(0.8, 15);
        const coreMaterial = new THREE.MeshPhongMaterial({
            color: 0x60e0ff,
            emissive: 0x60e0ff,
            emissiveIntensity: 1.5,
            shininess: 100,
            specular: 0x60e0ff,
            transparent: true,
            opacity: 0.9,
            wireframe: true // Cho cảm giác tech hơn
        });
        const coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreSphere);

        // b. Vòng sáng (Rings)
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x60e0ff,
            transparent: true,
            opacity: 0.5,
            wireframe: true
        });

        const rings = [];
        const ringParams = [
            { radius: 1.2, rotationSpeed: 0.01, axis: 'y' },
            { radius: 1.0, rotationSpeed: -0.015, axis: 'x' },
            { radius: 1.4, rotationSpeed: 0.005, axis: 'z' }
        ];

        ringParams.forEach(param => {
            const ringGeometry = new THREE.TorusGeometry(param.radius, 0.01, 16, 100);
            const ring = new THREE.Mesh(ringGeometry, ringMaterial.clone());
            ring.rotationSpeed = param.rotationSpeed;
            ring.axis = param.axis;
            scene.add(ring);
            rings.push(ring);
        });

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x60e0ff, 2, 10);
        pointLight.position.set(0, 0, 1.5);
        scene.add(pointLight);

        // Parallax Effect: Di chuyển nhẹ theo chuột
        let targetRotation = { x: 0, y: 0 };
        window.addEventListener('mousemove', function (event) {
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            targetRotation.x = y * 0.1; // Parallax nhẹ
            targetRotation.y = x * 0.1;
        });

        // Phản ứng click: Hiệu ứng "nổ" ánh sáng đơn giản bằng GSAP
        window.addEventListener('click', function () {
            const tl = gsap.timeline();
            tl.to(coreSphere.scale, { x: 2, y: 2, z: 2, duration: 0.1, ease: 'power2.out' })
              .to(coreMaterial, { emissiveIntensity: 10, opacity: 0.1, duration: 0.1, ease: 'power2.out' }, '-=0.1')
              .to(ringMaterial, { opacity: 0.1, duration: 0.1, ease: 'power2.out' }, '-=0.1')
              // Quay lại kích thước ban đầu
              .to(coreSphere.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: 'power2.inOut' })
              .to(coreMaterial, { emissiveIntensity: 1.5, opacity: 0.9, duration: 0.5, ease: 'power2.inOut' }, '-=0.5')
              .to(ringMaterial, { opacity: 0.5, duration: 0.5, ease: 'power2.inOut' }, '-=0.5');
        });

        function animateCore() {
            requestAnimationFrame(animateCore);

            // Cập nhật rotation parallax
            coreSphere.rotation.x += (targetRotation.x - coreSphere.rotation.x) * 0.1;
            coreSphere.rotation.y += (targetRotation.y - coreSphere.rotation.y) * 0.1;

            // Xoay các vòng sáng tự động và theo parallax
            rings.forEach(ring => {
                ring.rotation[ring.axis] += ring.rotationSpeed;
                ring.rotation.x += (targetRotation.x - ring.rotation.x) * 0.1;
                ring.rotation.y += (targetRotation.y - ring.rotation.y) * 0.1;
            });

            renderer.render(scene, camera);
        }

        // 3. Tiện ích: Cursor Glow & Typewriter
        // Cursor Glow
        const cursorGlow = document.createElement('div');
        cursorGlow.classList.add('cursor-glow');
        document.body.appendChild(cursorGlow);

        function updateCursorGlow(x, y) {
            cursorGlow.style.left = x + 'px';
            cursorGlow.style.top = y + 'px';
        }

        // Typewriter Effect
        const textElement = document.getElementById('typewriter-text');
        const phrases = ["Bạn muốn khám phá điều gì?", "Connecting to AI Core...", "Loading..."];
        let phraseIndex = 0;
        let charIndex = 0;
        let currentPhrase = "";
        let isDeleting = false;
        let typeSpeed = 100;

        function typeWriter() {
            if (phraseIndex >= phrases.length) {
                phraseIndex = 0; // Lặp lại
            }

            currentPhrase = phrases[phraseIndex];

            if (!isDeleting && charIndex < currentPhrase.length) {
                textElement.innerHTML += currentPhrase.charAt(charIndex);
                charIndex++;
                typeSpeed = 100;
            } else if (isDeleting && charIndex > 0) {
                textElement.innerHTML = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50;
            } else {
                isDeleting = !isDeleting;
                typeSpeed = 1000; // Tạm dừng khi viết xong hoặc xóa xong câu
                if (!isDeleting) {
                    phraseIndex++;
                    charIndex = 0;
                    typeSpeed = 500; // Nghỉ trước khi viết câu mới
                }
            }
            setTimeout(typeWriter, typeSpeed);
        }

        // Chạy mọi thứ
        initParticles();
        animateParticles();
        animateCore();
        typeWriter();

    </script>
</body>
</html>
